services:
  db:
    image: mysql:8.0
    container_name: shortener-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shortener}
      MYSQL_USER: ${DB_USER:-shortener}
      MYSQL_PASSWORD: ${DB_PASS:-shortener123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortener-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-shortener}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-shortener}
      DB_PASS: ${DB_PASS:-shortener123}
      APP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  mysql_data:
