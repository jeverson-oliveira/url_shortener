spring.application.name=shortener

spring.config.import=optional:file:.env[.properties]

# Datasource - defaults allow running without .env (docker-compose overrides via env)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:shortener}
spring.datasource.password=${DB_PASS:shortener123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# App
app.base-url=${APP_BASE_URL:http://localhost:8080}
server.port=8080

# OpenAPI / Swagger - serve em /docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method





